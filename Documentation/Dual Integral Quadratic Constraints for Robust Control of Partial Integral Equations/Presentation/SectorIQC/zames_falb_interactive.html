<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>STN–GPe Zames–Falb simulation</title>
<style>
body{font:18px Arial,sans-serif;color:#333;background:#fff;max-width:1440px;margin:auto;padding:12px}#stage{position:relative;aspect-ratio:16/9;container-type:inline-size}canvas{width:100%;height:100%;display:block}.label{position:absolute;white-space:nowrap;transform:translate(-50%,-50%);font-size:1.4cqw}.tick-right{transform:translate(-100%,-50%)}.title{font-weight:bold;font-size:1.85cqw}.math{font-family:'Cambria Math',Cambria,serif;font-size:1.65cqw}.vertical{transform:translate(-50%,-50%) rotate(-90deg)}nav{display:flex;gap:14px;align-items:center;padding:8px 4%}button,select{font:inherit;background:white;border:1px solid #ccc;padding:6px 10px}input{flex:1;min-width:60px}output{min-width:80px}
</style>
<div id="stage"><canvas id="plot" width="3840" height="2160" aria-label="Zames–Falb IQC simulation"></canvas><div id="labels"></div></div>
<nav><button id="play">Play</button><button id="restart">Restart</button><input id="time" aria-label="Time" type="range" min="0" max="400" step="0.2" value="0"><output id="clock">0.0 ms</output><select id="mode" aria-label="Supply plot"><option value="integral">Supply integral</option><option value="rate">Supply rate</option></select></nav>
<script>/*SIMULATION_DATA*/</script><script>
'use strict';const D=window.STN_DATA,$=id=>document.getElementById(id),c=$('plot'),ctx=c.getContext('2d');ctx.setTransform(3840/1440,0,0,2160/810,0,0);
const boxes=[[100,85,650,330],[800,85,1350,330],[100,480,650,725],[800,480,1350,725]],colors=['#174a80','#e6373e'],green='#147c60';let time=0,playing=false,last=null;
function line(pts,color,width=1){if(!pts.length)return;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function point(p,color){ctx.beginPath();ctx.arc(...p,5,0,2*Math.PI);ctx.fillStyle=color;ctx.fill()}
function label(s,x,y,cls=''){const n=document.createElement('span');n.className='label '+cls;n.style.left=(x/14.4)+'%';n.style.top=(y/8.1)+'%';n.innerHTML=s;$('labels').append(n)}
function axes(box,xlim,ylim,xticks,yticks,title,xlabel,ylabel){const[l,a,r,b]=box,p=(x,y)=>[l+(x-xlim[0])/(xlim[1]-xlim[0])*(r-l),b-(y-ylim[0])/(ylim[1]-ylim[0])*(b-a)];line([[l,a],[l,b],[r,b]],'#333');label(title,(l+r)/2,a-29,'title');for(const v of xticks){const x=p(v,ylim[0])[0];line([[x,b],[x,b+6]],'#333');label(Number(v.toFixed(2)),x,b+23)}for(const v of yticks){const y=p(xlim[0],v)[1];line([[l-6,y],[l,y]],'#333');label(v,l-13,y,'tick-right')}label(xlabel,(l+r)/2,b+57,'math');label(ylabel,l-(title==='Supply rate'?105:83),(a+b)/2,'math vertical');return p}
function draw(){ctx.fillStyle='#fff';ctx.fillRect(0,0,1440,810);$('labels').replaceChildren();const idx=Math.min(D.t.length-1,Math.round(time/.0002));
for(let k=0;k<2;k++){const lim=[1150,700][k],tag=['S','G'][k],p=axes(boxes[k],[-lim,lim],[-lim,lim],[-lim,0,lim],[-lim,0,lim],['STN nonlinearity','GPe nonlinearity'][k],`z<sub>${tag}</sub>(t)`,`w<sub>${tag}</sub>(t)`);line([p(-lim,0),p(lim,0)],'#aaa');line([p(0,-lim),p(0,lim)],'#ddd');const curve=[];for(let j=0;j<=500;j++){const z=-lim+2*lim*j/500,w=D.M[k]/2*(Math.tanh(2*(D.zStar[k]+z)/D.M[k])-Math.tanh(2*D.zStar[k]/D.M[k]));curve.push(p(z,w))}line(curve,colors[k],2.5);point(p(D.z[idx][k],D.w[idx][k]),colors[k])}
let p=axes(boxes[2],[0,.4],[-20,100],Array.from({length:9},(_,j)=>j*.05),[-20,0,20,40,60,80,100],'Response','t (s)','spikes/s');ctx.setLineDash([2,4]);line([p(0,0),p(.4,0)],'#888');ctx.setLineDash([]);for(let k=0;k<2;k++){line(D.t.slice(0,idx+1).map((t,j)=>p(t,D.x[j][k])),colors[k],2);line([[110,495+k*24],[135,495+k*24]],colors[k],2);label(['x<sub>S</sub> (STN)','x<sub>G</sub> (GPe)'][k],215,495+k*24,'math')}
const rate=$('mode').value==='rate',values=rate?D.q:D.integral,limits=rate?[-10000,100000]:[0,6000],ticks=rate?[0,50000,100000]:[0,2000,4000,6000];p=axes(boxes[3],[0,.4],limits,[0,.1,.2,.3,.4],ticks,rate?'Supply rate':'Supply function',rate?'t (s)':'T (s)',rate?'σ(t)':'∫₀ᵀ σ(t) dt');if(rate)line([p(0,0),p(.4,0)],'#aaa');for(let k=0;k<2;k++){const pts=D.t.slice(0,idx+1).map((t,j)=>p(t,values[j][k]));line(pts,colors[k],2.5);point(pts[pts.length-1],colors[k]);line([[810,495+k*24],[835,495+k*24]],colors[k],2);label(['STN','GPe'][k],885,495+k*24)}$('clock').value=(time*1000).toFixed(1)+' ms';$('time').value=time*1000;document.body.dataset.rendered='true'}
function frame(now){if(playing&&last!==null){time=Math.min(.4,time+(now-last)/1000*.4/12);if(time>=.4){playing=false;$('play').textContent='Play'}draw()}last=now;requestAnimationFrame(frame)}$('play').onclick=()=>{if(time>=.4)time=0;playing=!playing;last=null;$('play').textContent=playing?'Pause':'Play';draw()};$('restart').onclick=()=>{time=0;playing=false;$('play').textContent='Play';draw()};$('time').oninput=e=>{time=+e.target.value/1000;playing=false;$('play').textContent='Play';draw()};$('mode').onchange=draw;const query=new URLSearchParams(location.search);if(query.has('t'))time=Math.min(.4,Math.max(0,+query.get('t')));if(query.get('mode')==='rate')$('mode').value='rate';draw();requestAnimationFrame(frame);
</script></html>
